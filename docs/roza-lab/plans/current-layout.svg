<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 980" role="img" aria-labelledby="title desc">
  <title id="title">Roza Lab current-state plan with Working North and photo cameras</title>
  <desc id="desc">Evidence-based floor plan reconstructed from 13 overlapping photos. Working North is the sunroom daylight / tree-canopy axis, not surveyed true north.</desc>
  <defs>
    <pattern id="tiles" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#f4f1ea"/>
      <path d="M24 0H0V24" fill="none" stroke="#e4ddd0" stroke-width="0.6"/>
    </pattern>
    <pattern id="woodCeil" width="10" height="6" patternUnits="userSpaceOnUse">
      <rect width="10" height="6" fill="#c4a574"/>
      <path d="M0 6H10" stroke="#8b5e34" stroke-width="0.7"/>
    </pattern>
    <marker id="arrowN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1.5 L9 5 L0 8.5 z" fill="#9a3412"/>
    </marker>
    <marker id="cam" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 2 L10 6 L0 10 z" fill="#9a3412"/>
    </marker>
  </defs>

  <rect width="1120" height="980" fill="#faf7f2"/>
  <text x="40" y="36" font-family="Georgia, serif" font-size="22" fill="#3f2a1d">Roza Lab  current-state plan</text>
  <text x="40" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#6b5344">Reconstructed from 13 overlapping photos. Tile module assumed 600 mm. Not a measured survey. Working North = Window / Daylight axis.</text>

  <!-- Compass -->
  <g transform="translate(1000, 90)">
    <circle r="46" fill="#fff" stroke="#3f2a1d" stroke-width="1.5"/>
    <polygon points="0,-34 8,4 -8,4" fill="#9a3412"/>
    <polygon points="0,28 6,-2 -6,-2" fill="#3f2a1d"/>
    <text x="0" y="-38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#9a3412">N</text>
    <text x="0" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3f2a1d">S</text>
    <text x="40" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3f2a1d">E</text>
    <text x="-40" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3f2a1d">W</text>
    <text x="0" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6b5344">Working N</text>
    <text x="0" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#8a7060">daylight / trees</text>
  </g>

  <!-- Exterior trees north -->
  <g fill="#6b8f5e" opacity="0.85">
    <ellipse cx="220" cy="78" rx="28" ry="16"/>
    <ellipse cx="280" cy="72" rx="34" ry="18"/>
    <ellipse cx="360" cy="76" rx="30" ry="16"/>
    <ellipse cx="450" cy="70" rx="36" ry="18"/>
    <ellipse cx="540" cy="74" rx="32" ry="16"/>
    <ellipse cx="640" cy="72" rx="34" ry="18"/>
    <ellipse cx="740" cy="78" rx="28" ry="15"/>
    <ellipse cx="800" cy="110" rx="18" ry="28"/>
    <ellipse cx="812" cy="170" rx="16" ry="26"/>
  </g>
  <text x="480" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3d5c34">Tropical canopy  Window / Daylight axis</text>

  <!-- SUNROOM -->
  <g id="sunroom">
    <rect x="160" y="92" width="660" height="196" fill="url(#woodCeil)" stroke="#3f2a1d" stroke-width="2.5"/>
    <!-- north windows -->
    <rect x="176" y="92" width="620" height="14" fill="#cfe4f2" stroke="#111" stroke-width="2"/>
    <!-- east windows -->
    <rect x="806" y="108" width="14" height="150" fill="#cfe4f2" stroke="#111" stroke-width="2"/>
    <text x="490" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#3f2a1d">SUNROOM / enclosed balcony</text>
    <text x="490" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5c4030">dark wood-plank ceiling · black-framed windows · ~7.0 × 2.4 m</text>
    <!-- Crompton fan on south wall -->
    <circle cx="250" cy="268" r="16" fill="none" stroke="#111" stroke-width="2"/>
    <circle cx="250" cy="268" r="3" fill="#111"/>
    <text x="250" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#111">Crompton fan</text>
    <!-- black stone threshold -->
    <rect x="400" y="276" width="160" height="14" fill="#1a1a1a"/>
    <text x="480" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#fff">black stone threshold</text>
    <!-- interior viewing pane -->
    <rect x="370" y="248" width="12" height="40" fill="#cfe4f2" stroke="#111" stroke-width="1.5"/>
    <text x="330" y="270" text-anchor="end" font-family="system-ui, sans-serif" font-size="8" fill="#5c4030">interior pane</text>
  </g>

  <!-- CORRIDOR -->
  <g id="corridor">
    <rect x="400" y="290" width="160" height="430" fill="url(#tiles)" stroke="#3f2a1d" stroke-width="2"/>
    <text x="480" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3f2a1d">CORRIDOR</text>
    <text x="480" y="486" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6b5344">white ceiling · ~1.8 m</text>
    <!-- fridge west wall -->
    <rect x="406" y="360" width="28" height="52" fill="#8a93a0" stroke="#333"/>
    <text x="420" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#333">fridge</text>
    <!-- AC -->
    <rect x="406" y="328" width="36" height="14" fill="#f3f6f8" stroke="#888"/>
    <text x="448" y="339" font-family="system-ui, sans-serif" font-size="8" fill="#555">split AC</text>
    <!-- circulation -->
    <line x1="480" y1="700" x2="480" y2="320" stroke="#9a3412" stroke-width="3" marker-end="url(#arrowN)"/>
    <text x="492" y="520" font-family="system-ui, sans-serif" font-size="10" fill="#9a3412" transform="rotate(-90 492 520)">circulation ’ N / daylight</text>
  </g>

  <!-- LAB -->
  <g id="lab">
    <rect x="560" y="290" width="300" height="330" fill="url(#tiles)" stroke="#3f2a1d" stroke-width="2"/>
    <!-- glass + slat partition on west -->
    <rect x="560" y="300" width="10" height="310" fill="#1a1a1a"/>
    <rect x="560" y="300" width="10" height="140" fill="#5c3a21"/>
    <rect x="560" y="440" width="10" height="170" fill="#cfe4f2" stroke="#111"/>
    <!-- door in partition -->
    <path d="M570 430 Q620 430 620 480" fill="none" stroke="#111" stroke-width="1.2"/>
    <!-- L counters -->
    <rect x="590" y="304" width="250" height="36" fill="#d7b07a" stroke="#8b5e34"/>
    <rect x="804" y="304" width="36" height="250" fill="#d7b07a" stroke="#8b5e34"/>
    <circle cx="700" cy="322" r="5" fill="#c0392b"/>
    <circle cx="716" cy="322" r="5" fill="#c0392b"/>
    <circle cx="732" cy="322" r="5" fill="#c0392b"/>
    <rect x="600" y="310" width="22" height="16" fill="#c0c4c8" stroke="#666"/>
    <text x="710" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3f2a1d">LAB / QC bench</text>
    <text x="710" y="468" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c4030">glass + wood-slat partition · butcher-block</text>
    <text x="710" y="484" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c4030">microwave · kettle · red-lid jars · ceiling fan</text>
    <!-- east windows + blinds -->
    <rect x="846" y="310" width="14" height="200" fill="#cfe4f2" stroke="#111" stroke-width="2"/>
    <line x1="850" y1="318" x2="850" y2="500" stroke="#cbb89a" stroke-width="4"/>
    <text x="888" y="410" font-family="system-ui, sans-serif" font-size="9" fill="#5c4030" transform="rotate(90 888 410)">windows + vertical blinds</text>
    <circle cx="700" cy="400" r="14" fill="none" stroke="#bbb" stroke-width="2"/>
    <text x="700" y="404" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#888">fan</text>
  </g>

  <!-- WOOD DOOR (unverified room) -->
  <g id="wooddoor">
    <rect x="560" y="620" width="140" height="100" fill="#efe6d8" stroke="#3f2a1d" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="560" y="640" width="14" height="50" fill="#4a2f1c"/>
    <text x="640" y="665" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#3f2a1d">solid wood door</text>
    <text x="640" y="680" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6b5344">room beyond not photographed</text>
    <text x="640" y="694" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#9a3412">unverified  do not invent program</text>
  </g>

  <!-- CEO / executive cabin -->
  <g id="cabin">
    <rect x="160" y="500" width="240" height="220" fill="url(#tiles)" stroke="#3f2a1d" stroke-width="2"/>
    <!-- glass to corridor -->
    <rect x="390" y="510" width="10" height="200" fill="#cfe4f2" stroke="#111" stroke-width="2"/>
    <path d="M400 560 Q450 560 450 610" fill="none" stroke="#888" stroke-width="1.2"/>
    <!-- desk -->
    <rect x="200" y="560" width="110" height="54" fill="#4a2f1c"/>
    <rect x="208" y="566" width="94" height="8" fill="#d7b07a"/>
    <circle cx="230" cy="630" r="10" fill="#222"/>
    <circle cx="280" cy="630" r="10" fill="#222"/>
    <circle cx="255" cy="540" r="10" fill="#222"/>
    <!-- west window -->
    <rect x="160" y="530" width="10" height="50" fill="#cfe4f2" stroke="#111" stroke-width="2"/>
    <text x="280" y="545" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3f2a1d">GLASS CABIN</text>
    <text x="280" y="690" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c4030">executive desk · 3 chairs · high west window</text>
    <text x="175" y="555" font-family="system-ui, sans-serif" font-size="8" fill="#5c4030">window</text>
  </g>

  <!-- OPEN HALL -->
  <g id="hall">
    <rect x="160" y="720" width="540" height="150" fill="url(#tiles)" stroke="#3f2a1d" stroke-width="2"/>
    <text x="430" y="800" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3f2a1d">OPEN HALL / arrival</text>
    <text x="430" y="818" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6b5344">white ceiling · structural bulkhead · likely suite entry from building core (S)</text>
  </g>

  <!-- Photo cameras: correct evidence mapping -->
  <g id="cameras" font-family="system-ui, sans-serif" font-size="9" fill="#9a3412" font-weight="700">
    <!-- P01 P02 inner hall facing N -->
    <line x1="360" y1="790" x2="360" y2="740" stroke="#9a3412" stroke-width="2" marker-end="url(#cam)"/>
    <text x="368" y="792">P01 · P02 face N</text>
    <!-- P04 side hall facing N -->
    <line x1="430" y1="700" x2="430" y2="650" stroke="#9a3412" stroke-width="2" marker-end="url(#cam)"/>
    <text x="438" y="710">P04 face N</text>
    <!-- P03 P07 cabin facing W -->
    <line x1="330" y1="600" x2="230" y2="600" stroke="#9a3412" stroke-width="2" marker-end="url(#cam)"/>
    <text x="250" y="618">P03 · P07 face W</text>
    <!-- P05 P06 corridor facing E into lab -->
    <line x1="480" y1="430" x2="545" y2="430" stroke="#9a3412" stroke-width="2" marker-end="url(#cam)"/>
    <text x="470" y="422">P05 · P06 face E</text>
    <!-- P09 P10 threshold facing S -->
    <line x1="520" y1="230" x2="520" y2="285" stroke="#9a3412" stroke-width="2" marker-end="url(#cam)"/>
    <text x="528" y="224">P09 · P10 face S</text>
    <!-- P08 P11 sunroom facing E -->
    <line x1="220" y1="190" x2="320" y2="190" stroke="#9a3412" stroke-width="2" marker-end="url(#cam)"/>
    <text x="220" y="182">P08 · P11 face E</text>
    <!-- P12 P13 sunroom facing W -->
    <line x1="760" y1="210" x2="660" y2="210" stroke="#9a3412" stroke-width="2" marker-end="url(#cam)"/>
    <text x="668" y="202">P12 · P13 face W</text>
  </g>

  <!-- Scale -->
  <g transform="translate(40, 900)">
    <rect x="0" y="0" width="80" height="8" fill="#3f2a1d"/>
    <rect x="80" y="0" width="80" height="8" fill="#fff" stroke="#3f2a1d"/>
    <rect x="160" y="0" width="80" height="8" fill="#3f2a1d"/>
    <text y="-6" font-family="system-ui, sans-serif" font-size="10" fill="#3f2a1d">0</text>
    <text x="80" y="-6" font-family="system-ui, sans-serif" font-size="10" fill="#3f2a1d">1</text>
    <text x="160" y="-6" font-family="system-ui, sans-serif" font-size="10" fill="#3f2a1d">2</text>
    <text x="240" y="-6" font-family="system-ui, sans-serif" font-size="10" fill="#3f2a1d">3 m</text>
    <text x="0" y="28" font-family="system-ui, sans-serif" font-size="11" fill="#6b5344">Assumed 600 mm tile · overall suite ~ 8.0 × 9.5 m H 5570 m² (±20%)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(820, 760)" font-family="system-ui, sans-serif" font-size="10" fill="#3f2a1d">
    <text font-weight="700" font-size="12">Legend</text>
    <rect y="14" width="22" height="12" fill="#cfe4f2" stroke="#111"/>
    <text x="30" y="24">glass / window</text>
    <rect y="32" width="22" height="12" fill="#4a2f1c"/>
    <text x="30" y="42">solid wood door / desk</text>
    <rect y="50" width="22" height="12" fill="#1a1a1a"/>
    <text x="30" y="60">black stone threshold</text>
    <rect y="68" width="22" height="12" fill="#c4a574"/>
    <text x="30" y="78">wood-plank ceiling zone</text>
    <line x1="0" y1="96" x2="22" y2="96" stroke="#9a3412" stroke-width="2" marker-end="url(#cam)"/>
    <text x="30" y="100">photo camera + facing</text>
  </g>
</svg>
