<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 980" role="img" aria-labelledby="title desc">
  <title id="title">Roza Lab proposed zoning plan</title>
  <desc id="desc">Same evidenced envelope as the current plan, reprogrammed for CEO, marketing, QC/R&amp;D, roastery test, and central TV monitoring.</desc>
  <defs>
    <pattern id="tiles2" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#f4f1ea"/>
      <path d="M24 0H0V24" fill="none" stroke="#e4ddd0" stroke-width="0.6"/>
    </pattern>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1.5 L9 5 L0 8.5 z" fill="#9a3412"/>
    </marker>
  </defs>
  <rect width="1120" height="980" fill="#faf7f2"/>
  <text x="40" y="36" font-family="Georgia, serif" font-size="22" fill="#3f2a1d">Roza Lab  proposed zoning</text>
  <text x="40" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#6b5344">Keep existing glass / wood-slat partitions and the sunroom envelope. Reprogram rooms; do not add un-evidenced volumes.</text>

  <g transform="translate(1000, 90)">
    <circle r="46" fill="#fff" stroke="#3f2a1d" stroke-width="1.5"/>
    <polygon points="0,-34 8,4 -8,4" fill="#9a3412"/>
    <text x="0" y="-38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#9a3412">N</text>
    <text x="40" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11">E</text>
    <text x="-40" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11">W</text>
    <text x="0" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11">S</text>
    <text x="0" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6b5344">Working N</text>
  </g>

  <!-- sunroom = Nikhil + TV -->
  <rect x="160" y="92" width="660" height="196" fill="#f3e6c8" stroke="#3f2a1d" stroke-width="2.5"/>
  <rect x="176" y="92" width="620" height="14" fill="#cfe4f2" stroke="#111" stroke-width="2"/>
  <rect x="806" y="108" width="14" height="150" fill="#cfe4f2" stroke="#111" stroke-width="2"/>
  <rect x="400" y="276" width="160" height="14" fill="#1a1a1a"/>
  <rect x="200" y="248" width="90" height="28" fill="#2b2b2b"/>
  <text x="245" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#eee">65" TV wall</text>
  <rect x="200" y="130" width="420" height="36" fill="#4a2f1c"/>
  <text x="490" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3f2a1d">NIKHIL  Marketing Head</text>
  <text x="490" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5c4030">campaign table on daylight wall · TV monitoring on solid south wall</text>
  <text x="490" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5c4030">keep Crompton fan · do not block north/east windows</text>

  <!-- corridor -->
  <rect x="400" y="290" width="160" height="430" fill="url(#tiles2)" stroke="#3f2a1d" stroke-width="2"/>
  <rect x="406" y="360" width="28" height="52" fill="#8a93a0" stroke="#333"/>
  <rect x="406" y="328" width="36" height="14" fill="#f3f6f8" stroke="#888"/>
  <text x="480" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SHARED SPINE</text>
  <text x="480" y="516" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6b5344">pantry fridge · AC · cameras</text>
  <line x1="480" y1="700" x2="480" y2="320" stroke="#9a3412" stroke-width="3" marker-end="url(#arrowP)"/>

  <!-- lab = Sangeetha + roastery zone -->
  <rect x="560" y="290" width="300" height="210" fill="#e7f0d8" stroke="#3f2a1d" stroke-width="2"/>
  <rect x="560" y="500" width="300" height="120" fill="#f7d7c4" stroke="#3f2a1d" stroke-width="2"/>
  <rect x="560" y="300" width="10" height="310" fill="#5c3a21"/>
  <rect x="590" y="304" width="250" height="32" fill="#d7b07a" stroke="#8b5e34"/>
  <rect x="804" y="304" width="36" height="200" fill="#d7b07a" stroke="#8b5e34"/>
  <rect x="846" y="310" width="14" height="200" fill="#cfe4f2" stroke="#111" stroke-width="2"/>
  <text x="710" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700">SANGEETHA  QC / R&amp;D</text>
  <text x="710" y="396" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c4030">sample bench · 40005000 K QC lighting · scale</text>
  <text x="710" y="560" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700">ROASTERY COOK TEST</text>
  <text x="710" y="576" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c4030">sink / kettle / induction / extractor  not in CEO cabin</text>

  <!-- wood door still unverified -->
  <rect x="560" y="620" width="140" height="100" fill="#efe6d8" stroke="#3f2a1d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="630" y="668" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700">VERIFY ROOM</text>
  <text x="630" y="684" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6b5344">candidate: sealed store / waste</text>

  <!-- CEO -->
  <rect x="160" y="500" width="240" height="220" fill="#ead9c8" stroke="#3f2a1d" stroke-width="2"/>
  <rect x="390" y="510" width="10" height="200" fill="#cfe4f2" stroke="#111" stroke-width="2"/>
  <rect x="160" y="530" width="10" height="50" fill="#cfe4f2" stroke="#111" stroke-width="2"/>
  <rect x="200" y="560" width="110" height="54" fill="#4a2f1c"/>
  <text x="280" y="545" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700">ROSHAN MAHAMOOD  CEO</text>
  <text x="280" y="690" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c4030">privacy + glass visual link + west foliage window</text>

  <!-- hall = reception -->
  <rect x="160" y="720" width="540" height="150" fill="#efe7dc" stroke="#3f2a1d" stroke-width="2"/>
  <text x="430" y="790" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700">RECEPTION / visitor pause</text>
  <text x="430" y="808" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6b5344">C4 entry camera · no heat equipment · sightline up the spine</text>

  <!-- cameras -->
  <g fill="#7f1d1d" font-family="system-ui, sans-serif" font-size="11" font-weight="700">
    <circle cx="390" cy="250" r="10" fill="#7f1d1d"/><text x="390" y="254" text-anchor="middle" fill="#fff">C1</text>
    <circle cx="470" cy="640" r="10" fill="#7f1d1d"/><text x="470" y="644" text-anchor="middle" fill="#fff">C2</text>
    <circle cx="580" cy="320" r="10" fill="#7f1d1d"/><text x="580" y="324" text-anchor="middle" fill="#fff">C3</text>
    <circle cx="200" cy="740" r="10" fill="#7f1d1d"/><text x="200" y="744" text-anchor="middle" fill="#fff">C4</text>
  </g>

  <g transform="translate(40, 900)" font-family="system-ui, sans-serif" font-size="11" fill="#3f2a1d">
    <rect width="18" height="12" fill="#ead9c8" stroke="#3f2a1d"/><text x="26" y="10">CEO</text>
    <rect x="80" width="18" height="12" fill="#f3e6c8" stroke="#3f2a1d"/><text x="106" y="10">Marketing + TV</text>
    <rect x="230" width="18" height="12" fill="#e7f0d8" stroke="#3f2a1d"/><text x="256" y="10">QC / R&amp;D</text>
    <rect x="340" width="18" height="12" fill="#f7d7c4" stroke="#3f2a1d"/><text x="366" y="10">Roastery heat</text>
    <rect x="480" width="18" height="12" fill="#efe7dc" stroke="#3f2a1d"/><text x="506" y="10">Reception</text>
    <circle cx="620" cy="6" r="8" fill="#7f1d1d"/><text x="620" y="10" text-anchor="middle" fill="#fff" font-size="8">C</text>
    <text x="634" y="10">cameras</text>
  </g>
</svg>
